<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multiplication Table Practice</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #4a00e0, #8e2de2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    .game-card {
      background-color: #121212;
      border: 6px solid #ff007f;
      border-radius: 24px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2.8rem;
      margin-top: 0;
      margin-bottom: 20px;
      color: #00f0ff;
      text-shadow: 2px 2px #000;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .score-board {
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
      background-color: #1e1e1e;
      padding: 15px;
      border-radius: 16px;
      border: 2px solid #333;
    }

    .score-box {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .correct-score {
      color: #00ff66;
    }

    .wrong-score {
      color: #ff3366;
    }

    .problem {
      font-size: 5rem;
      font-weight: 900;
      margin: 20px 0;
      color: #ffea00;
      text-shadow: 4px 4px #000;
      letter-spacing: 4px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    input[type="number"] {
      font-size: 3rem;
      width: 160px;
      text-align: center;
      padding: 10px;
      border-radius: 12px;
      border: 4px solid #00f0ff;
      background-color: #222;
      color: #fff;
      font-weight: bold;
      outline: none;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    button {
      font-size: 1.8rem;
      font-weight: bold;
      padding: 10px 25px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-submit {
      background-color: #00f0ff;
      color: #000;
    }

    .btn-submit:hover {
      background-color: #00c4d4;
      transform: scale(1.05);
    }

    .feedback {
      font-size: 2.2rem;
      font-weight: 900;
      min-height: 50px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .feedback.correct {
      color: #00ff66;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }

    .feedback.wrong {
      color: #ff3366;
      text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Math Power</h1>

    <div class="score-board">
      <div class="score-box correct-score">
        ✔ Right: <span id="right-count">0</span>
      </div>
      <div class="score-box wrong-score">
        ✖ Wrong: <span id="wrong-count">0</span>
      </div>
    </div>

    <div class="problem" id="problem-display">? × ?</div>

    <form id="game-form" onsubmit="checkAnswer(event)">
      <div class="input-group">
        <input 
          type="number" 
          id="user-answer" 
          autocomplete="off" 
          required 
          autofocus 
        />
        <button type="submit" class="btn-submit">GO!</button>
      </div>
    </form>

    <div class="feedback" id="feedback"></div>
  </div>

  <script>
    let num1 = 0;
    let num2 = 0;
    let rightCount = 0;
    let wrongCount = 0;

    const problemDisplay = document.getElementById('problem-display');
    const answerInput = document.getElementById('user-answer');
    const feedbackDisplay = document.getElementById('feedback');
    const rightCountDisplay = document.getElementById('right-count');
    const wrongCountDisplay = document.getElementById('wrong-count');

    function generateProblem() {
      // Generates numbers from 1 to 12
      num1 = Math.floor(Math.random() * 12) + 1;
      num2 = Math.floor(Math.random() * 12) + 1;
      problemDisplay.textContent = `${num1} × ${num2}`;
      answerInput.value = '';
      answerInput.focus();
    }

    function checkAnswer(event) {
      event.preventDefault();

      const userAnswer = parseInt(answerInput.value, 10);
      const correctAnswer = num1 * num2;

      if (userAnswer === correctAnswer) {
        rightCount++;
        rightCountDisplay.textContent = rightCount;
        feedbackDisplay.textContent = 'CORRECT!';
        feedbackDisplay.className = 'feedback correct';
      } else {
        wrongCount++;
        wrongCountDisplay.textContent = wrongCount;
        feedbackDisplay.textContent = `WRONG! (${num1} × ${num2} = ${correctAnswer})`;
        feedbackDisplay.className = 'feedback wrong';
      }

      generateProblem();
    }

    // Start initial game round
    generateProblem();
  </script>
</body>
</html>
